definitions:
  ThresholdCondition:
    type: object
    properties:
      info:
        minimum: 0
        type: number
        format: double
      warning:
        minimum: 0
        type: number
        format: double
      critical:
        minimum: 0
        type: number
        format: double
  TriggerPolicyCreateRequest:
    required:
    - aggregationType
    - holdDuration
    - repeatInterval
    - resourceType
    - thresholdCondition
    - title
    type: object
    properties:
      title:
        type: string
        description: Policy title
        example: CPU Alert Policy
      description:
        type: string
        description: Policy description (optional)
        example: Alert when CPU usage is high
      thresholdCondition:
        $ref: '#/definitions/ThresholdCondition'
      resourceType:
        type: string
        description: Resource type
        example: CPU
        enum:
        - CPU
        - MEMORY
        - DISK
      aggregationType:
        type: string
        description: Aggregation type
        example: LAST
        enum:
        - MIN
        - MAX
        - AVG
        - LAST
      holdDuration:
        pattern: ^([0-9]|[1-5][0-9]|60)[sm]$
        type: string
        description: Hold duration
        example: 0m
      repeatInterval:
        pattern: ^([1-9]|1[0-9]|2[0-4])h$
        type: string
        description: Repeat interval
        example: 1h
  ResBodyVoid:
    type: object
    properties:
      rs_code:
        type: string
        description: Response code
        example: '0000'
      rs_msg:
        type: string
        description: Response message
        example: success
      data:
        type: object
      error_message:
        type: string
        description: Error message
  TriggerPolicyNotiChannelUpdateRequest:
    required:
