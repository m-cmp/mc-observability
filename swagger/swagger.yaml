      - '[Manager] Monitoring Trace'
      summary: TraceSearch
      description: Search Tempo trace summaries. Provide a raw TraceQL `query`, or filter with `service` / `keyword` over
        a time window.
      operationId: TraceSearch
      produces:
      - application/json
      parameters:
      - name: query
        in: query
        description: Raw TraceQL (e.g. { resource.service.name="svc" }). Overrides service/keyword.
        required: false
        type: string
      - name: service
        in: query
        description: Service name filter (resource.service.name)
        required: false
        type: string
      - name: keyword
        in: query
        description: Free-text keyword (matches span name or service name)
        required: false
        type: string
      - name: scope
        in: query
        description: 'Trace scope: framework (o11y platform) | vm (target VMs) | all'
        required: false
        type: string
      - name: start
        in: query
        description: Start time (RFC3339 or unix epoch). Defaults to 1h ago.
        required: false
        type: string
      - name: end
        in: query
        description: End time (RFC3339 or unix epoch). Defaults to now.
        required: false
        type: string
      - name: limit
        in: query
        description: Maximum number of traces
        required: false
        type: integer
        format: int32
      responses:
        '200':
          description: ''
          schema:
