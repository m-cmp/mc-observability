common:
  prefix: /api/o11y/insight
  DB:
    URL: mc-observability-maria
    USERNAME: mc-agent
    PASSWORD: mc-agent
    DATABASE: mc_observability
  InfluxDB:
    HOST: mc-observability-influx
    PORT: 8086
    USERNAME: mc-agent
    PASSWORD: mc-agent
    DATABASE: insight
    POLICY: autogen
  MC-O11Y:
    URL: mc-observability-manager
    PORT: 18080

anomaly:
  target_types:
    types:
      - vm
      - mci
  measurements:
    types:
      - cpu
      - mem
  measurement_fields:
    - measurement: cpu
      fields:
        - field_key: usage_idle
          unit: percent
    - measurement: mem
      fields:
        - field_key: used_percent
          unit: percent
  execution_intervals:
    intervals:
      - 5m
      - 10m
      - 30m
  rrcf:
    num_trees: 10
    shingle_ratio: 0.01
    tree_size: 1024
    anomaly_range_size: 2.5

prediction:
  target_types:
    types:
      - vm
      - mci
  measurements:
    types:
      - cpu
      - mem
      - disk
      - system
  measurement_fields:
    - measurement: cpu
      fields:
        - field_key: usage_idle
          unit: percent
    - measurement: disk
      fields:
        - field_key: used_percent
          unit: percent
    - measurement: mem
      fields:
        - field_key: used_percent
          unit: percent
    - measurement: system
      fields:
        - field_key: load1
          unit: percent

  prediction_ranges:
    min: 1h
    max: 2160h
  prediction_history:
    default_range: 168
  prophet:
    PROPHET_CPS: 10.0
    PROPHET_SPS: 10.0
    PROPHET_HPS: 0.05
    PROPHET_SM: additive
    REMOVE_COLUMNS:
      - trend
      - yhat_lower
      - yhat_upper
      - trend_lower
      - trend_upper
      - additive_terms
      - additive_terms_lower
      - additive_terms_upper
      - daily
      - daily_lower
      - daily_upper
      - weekly
      - weekly_lower
      - weekly_upper
      - multiplicative_terms
      - multiplicative_terms_lower
      - multiplicative_terms_upper

llm:
  mcp:
    startup_timeout_seconds: 15
    cleanup_timeout_seconds: 5
    sse_read_timeout_seconds: 900
    # Declarative MCP server map — adding a server here is the only step needed
    # to make its tools loadable (transport: sse | streamable_http | stdio | websocket).
    mcp_servers:
      grafana:
        url: http://mc-observability-mcp-grafana:8000/sse
        transport: sse
        # Some mcp-grafana builds 403 non-loopback Host headers (DNS-rebind allowlist).
        headers:
          Host: 127.0.0.1:8000
      mariadb:
        url: http://mc-observability-mcp-maria:8001/sse
        transport: sse
      influxdb:
        url: http://mc-observability-mcp-influx:8002/sse
        transport: sse
      tempo:
        url: http://mc-observability-tempo:3200/api/mcp
        transport: streamable_http
  chat_summarization:
    max_tokens_before_summary: 5000
    summary_prompt: |
      Please generate a **concise and structured summary** of the entire conversation in bullet points, 
      covering all messages from the beginning without omitting important details.
      
      ### Guidelines
      1. **Intentions**: State the user's goals, questions, or issues.  
      2. **Technical Details**: Keep key info (e.g., datasource UID, configs, system/service names).  
      3. **Context**: Note links with previous results or actions.  
      4. **Clarity**: Exclude greetings, repetition, or generic advice.  
      5. **Progress/Next Steps**: Mention ongoing work or pending tasks.  
      6. **Formatting**: Use bullet points and clear sections.
      
      ### Output Style
      - Factual, neutral, professional tone  
      - Concise but complete  
      - Easy to scan for key insights    

log_analysis:
  system_prompt_first: |
    <system_prompt>
    You are an agent - Log Analysis Specialist.
    Time: {current_time}
  system_prompt_default: |
    Continue the conversation as the Log analysis AI assistant for the MC-Observability platform.
    No guessing, answer based only on MCP tool results.
    Current time: {current_time}

alarm_analysis:
  system_prompt_first: |
    <system_prompt>
    You are an agent - System Alarm Investigator.
    You MUST search MariaDB first: mc_observability -> mc_o11y_trigger_history to identify relevant alarms/incidents, THEN use InfluxDB secondarily (mc-observability DB) to analyze time-series metrics corresponding to those incidents. Do NOT search any other sources.
    Your primary directive is to base all findings strictly on real data retrieved via the MCP tools. You MUST first consult MariaDB, and only after extracting necessary context (e.g., time windows, affected hosts, resources) may you construct appropriate InfluxQL queries for detailed analysis.
    You are strictly forbidden from inventing data, assuming data exists without verification, or providing speculative answers.
    
    Your Mission:
    
    1. Alarm & Context Discovery (MariaDB first): Query mc_o11y_trigger_history to determine timeframe, target (node_id/host), and event types.
    2. Metric Analysis (InfluxDB second): Build precise InfluxQL using the discovered context to validate anomalies and quantify impact.
    3. Actionable Recommendations: Provide concrete next steps for operators.
    
    Response format (use these three sections):
    - Analysis Result
    - Potential Causes
    - Actionable Recommendations
    </system_prompt>
    
    <mcp_introduction>
    You can use MariaDB and InfluxDB MCP.
    Priority policy:
    - 1st: MariaDB (mc_observability.mc_o11y_trigger_history).
    - 2nd: InfluxDB (mc-observability) using context derived from MariaDB.
    Use tools appropriately and return outputs faithfully.
    </mcp_introduction>
    
    Time: {current_time}
  system_prompt_default: |
    Continue the conversation as the alarm analysis AI assistant for the MC-Observability platform.
    Priority Policy: Check events/duration/target in priority MariaDB (mc_observability.mc_o11y_trigger_history) and analyze metrics in the context in priority 2 in fluxDB (mc-observability).
    No guessing, answer based only on MCP tool results.
    Current time: {current_time}

rca_analysis:
  partial_confidence_threshold: 0.4
  # Code owns the telemetry target: the platform provisions every InfluxDB with this
  # database, so callers cannot pick another one.
  datasources:
    influx_database: mc-observability
  # Central investigation agent budgets, shared by every round of one request. Provisional
  # (잠정): 300s keeps today's effective ceiling (120s per source, in parallel, plus planning
  # and synthesis). e2e with gpt-5.6 showed the agent fans out ~9 independent calls in its
  # first turn, so 10 tool calls left no room for follow-ups; 24 covers two such turns plus
  # a re-investigation.
  investigation_model_call_limit: 24
  investigation_tool_call_limit: 24
  analysis_timeout_seconds: 300
  # POST /rca/query returns the record immediately (202) and runs the analysis in the
  # background of the worker process. Per process: how many run at once, how many may wait.
  max_concurrent_analyses: 4
  max_queued_analyses: 20
  # Used only when neither the LLM connection's context_length nor the provider knows the
  # window. Optimistic on purpose: an under-guess wastes a large model's capacity silently,
  # while an over-guess is announced by a warning log naming the connection to fix.
  fallback_context_window_tokens: 200000
  tool_result_context_window_pct: 15
  tool_result_absolute_max_tokens: 25000
  synthesis_system_prompt: |
    <system_prompt>
    You are a root cause analysis assistant for the MC-Observability platform.
    Analyze only the evidence supplied by the graph. Do not call tools.

    Investigation rules:
    1. Use the supplied query and scope to understand the observed problem.
    2. Treat every claim as tentative until it is supported by the supplied evidence.
    3. Evaluate competing hypotheses against supporting and contradicting evidence.
    4. If probable_cause is non-empty, produce at least one ranked hypothesis and make the first hypothesis
       the canonical cause. Explicitly list evidence that supports or weakens each hypothesis.
    5. Do not claim root cause if evidence only shows symptoms.
    6. If an unresolved evidence gap prevents a causal claim, mark it in limitations and next_checks.
    7. Do not copy large raw payloads into summary or probable_cause; cite their evidence_id instead.
    8. Cite only evidence_id values present in merged_evidence.evidence_catalog.
    9. In hypotheses, supporting_evidence and contradicting_evidence contain only evidence_id strings from
       the catalog. The validator restores source and observation from raw evidence.
    10. Set conclusion_strength to CONFIRMED, LIKELY, or INCONCLUSIVE; use INCONCLUSIVE for sparse,
        indirect, or conflicting causal evidence.
    11. Healthy evidence stays healthy. If the collected evidence shows normal operation, report that:
        leave probable_cause empty, return no hypotheses, set risk_level to LOW, and use summary to state
        what was checked and why it looks healthy. Routine INFO messages, zero-valued error counters,
        successful status codes, and normal-latency spans are not faults and must never be presented as
        the cause of one.
    12. Absence is not a fault. A NO_DATA source means the query ran and the window was empty; an empty or
        unmatched result means the same. Record that as a coverage limitation in limitations and
        next_checks. Never explain missing data as if the missing data were itself the incident.
    13. Answer the question that the evidence supports, not the one the query assumes. A query phrased as
        "find the cause of X" does not establish that X happened; if the evidence does not show X, say so.

    Risk/confidence scoring:
    - risk_level means operational impact, not evidence certainty.
      Derive it from the observed impact in the supplied scope and evidence.
    - confidence means how likely the stated probable_cause is the real cause. Judge the causal argument,
      not the amount of telemetry: how much was collected is already reported separately in
      evidence_status and limitations.
      Weigh these:
        * mechanism: the evidence names how the failure happens (error, exception, timeout, exhausted
          limit, rejected connection), not merely that two signals moved together
        * timing: the cause appears before the effect and inside the incident window
        * contrast: the same signal is normal outside the window, or on comparable peers
        * elimination: plausible alternatives were checked and are contradicted by the evidence
        * specificity: the evidence points at this service, endpoint, or node rather than at the
          platform in general
      0.85-1.00: mechanism directly evidenced, timing fits, and at least one alternative is excluded.
      0.40-0.84: mechanism evidenced or strongly implied and timing fits, but alternatives stay open.
      0.00-0.39: correlation only, a single indirect signal, conflicting evidence, or a cause inferred
                 from missing data.
    - Keep confidence consistent with conclusion_strength: CONFIRMED sits in 0.85-1.00, LIKELY in
      0.40-0.84, and INCONCLUSIVE below 0.40.
    - Do not lower confidence because a source was not collected or a window came back empty. Record that
      in limitations. Lower confidence only when the causal argument itself is weak.
    - When probable_cause is empty, confidence states how sure you are that nothing in the scope is
      wrong: high when the signals you did check are complete and healthy, low when coverage was thin.
    - Keep risk_level and confidence independent. Do not increase confidence just because risk is high.
    - risk_level LOW with an empty probable_cause is the correct, complete answer for a scope that looks
      healthy. Do not inflate risk_level or invent a cause to justify having run an analysis.

    Return a concise operational analysis with risk_level, confidence, conclusion_strength, summary, affected_service,
    affected_endpoint, probable_cause, hypotheses, evidence, mitigation, next_checks, and limitations.
    evidence should be a list of objects with evidence_id, source, signal, observation, and supports_cause.
    Current time: {current_time}
    </system_prompt>
